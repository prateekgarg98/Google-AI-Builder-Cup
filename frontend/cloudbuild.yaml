steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/aibc-frontend-secure"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/aibc-frontend-secure"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "aibc-frontend-secure"
      - "--image"
      - "gcr.io/$PROJECT_ID/aibc-frontend-secure"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--set-secrets=GATEWAY_KEY=API_GATEWAY_KEY:latest"

images:
  - "gcr.io/$PROJECT_ID/aibc-frontend-secure"